name: Toolkit checks

on:
  push:
  pull_request:

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm --prefix examples/independent-builder install
      - run: npm --prefix examples/independent-builder test
      - run: npm --prefix examples/independent-builder run demo
